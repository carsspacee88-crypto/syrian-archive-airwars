name: جمع بيانات Airwars

on:
  push:
    branches: [main]
    paths:
      - ".github/v4-request.json"
  workflow_dispatch:
    inputs:
      operation:
        description: "العملية"
        required: true
        default: collect
        type: choice
        options:
          - collect
          - recover
      first_sequence:
        description: "أول حادثة في النطاق"
        required: true
        default: "263"
        type: string
      last_sequence:
        description: "آخر حادثة في النطاق"
        required: true
        default: "1000"
        type: string
      workers:
        description: "عدد عمال الشبكة العالميين (V4)"
        required: true
        default: "64"
        type: string
      per_host_workers:
        description: "الحد المتوازي لكل مضيف"
        required: true
        default: "1"
        type: string
      delay:
        description: "الفاصل الأدنى لكل مضيف بالثواني"
        required: true
        default: "0.75"
        type: string
      source_batch_size:
        description: "حجم دفعة المصادر المحفوظة"
        required: true
        default: "1000"
        type: string
      recovery_limit:
        description: "أقصى عناصر الاسترداد في التشغيل"
        required: true
        default: "500"
        type: string

permissions:
  contents: read

concurrency:
  group: airwars-v4-collector
  cancel-in-progress: false

jobs:
  collect-build-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      actions: write
      contents: write
    env:
      PYTHONUNBUFFERED: "1"
      TRANSLATION_PROVIDER: disabled

    steps:
      - name: جلب مشروع الأرشيف السوري
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: إعداد Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: تحميل طلب تشغيل V4 والتحقق منه
        id: request
        shell: bash
        env:
          V4_EVENT_NAME: ${{ github.event_name }}
          V4_EVENT_SHA: ${{ github.sha }}
          V4_INPUT_OPERATION: ${{ inputs.operation }}
          V4_INPUT_FIRST: ${{ inputs.first_sequence }}
          V4_INPUT_LAST: ${{ inputs.last_sequence }}
          V4_INPUT_WORKERS: ${{ inputs.workers }}
          V4_INPUT_PER_HOST: ${{ inputs.per_host_workers }}
          V4_INPUT_DELAY: ${{ inputs.delay }}
          V4_INPUT_SOURCE_BATCH: ${{ inputs.source_batch_size }}
          V4_INPUT_RECOVERY_LIMIT: ${{ inputs.recovery_limit }}
        run: |
          set -euo pipefail
          request_file=.github/v4-request.json
          if [[ "$V4_EVENT_NAME" == "push" ]]; then
            request_file="$RUNNER_TEMP/v4-request.json"
            git show "${V4_EVENT_SHA}:.github/v4-request.json" > "$request_file"
          fi
          python scripts/resolve_v4_request.py \
            --event-name "$V4_EVENT_NAME" \
            --request-file "$request_file" \
            --operation "$V4_INPUT_OPERATION" \
            --first-sequence "$V4_INPUT_FIRST" \
            --last-sequence "$V4_INPUT_LAST" \
            --workers "$V4_INPUT_WORKERS" \
            --per-host-workers "$V4_INPUT_PER_HOST" \
            --delay "$V4_INPUT_DELAY" \
            --source-batch-size "$V4_INPUT_SOURCE_BATCH" \
            --recovery-limit "$V4_INPUT_RECOVERY_LIMIT"

      - name: تثبيت المحرك وأدوات التحقق
        run: python -m pip install -r requirements-vps.txt

      - name: فحص V4 وبقية الأرشيف قبل الجمع
        run: python -m unittest discover -s tests -v

      - name: تكوين لقطة الهجرة التاريخية
        shell: bash
        run: |
          set -euo pipefail
          cat site-package/part-* > /tmp/syrian-archive-site.zip
          echo "9f35a90d92f9fb0334cb61ffd8434aac03fd0ee61622908a11923dac40da35f3  /tmp/syrian-archive-site.zip" | sha256sum --check

      - name: تشغيل الجمع أو استرداد المتعذر بمحرك V4
        id: collector
        uses: ./.github/actions/v4-collector
        with:
          operation: ${{ steps.request.outputs.operation }}
          first_sequence: ${{ steps.request.outputs.first_sequence }}
          last_sequence: ${{ steps.request.outputs.last_sequence }}
          workers: ${{ steps.request.outputs.workers }}
          per_host_workers: ${{ steps.request.outputs.per_host_workers }}
          delay: ${{ steps.request.outputs.delay }}
          source_batch_size: ${{ steps.request.outputs.source_batch_size }}
          recovery_limit: ${{ steps.request.outputs.recovery_limit }}
          legacy_zip: /tmp/syrian-archive-site.zip

      - name: عرض ملخص التشغيل
        shell: bash
        env:
          SUMMARY_PATH: ${{ steps.collector.outputs.summary_markdown }}
        run: |
          set -euo pipefail
          test -s "$SUMMARY_PATH"
          cat "$SUMMARY_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: تحديث التقارير وبناء الموقع
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_reports.py \
            --legacy-zip /tmp/syrian-archive-site.zip \
            --output-root .
          mkdir -p _site
          unzip -q /tmp/syrian-archive-site.zip -d _site
          python scripts/build_site.py --site-root _site --project-root .

      - name: التحقق الكامل من البيانات والموقع
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_site.py \
            --site-root _site \
            --project-root . \
            --legacy-zip /tmp/syrian-archive-site.zip \
            --report-root _site/data/reports
          python scripts/write_checksums.py --site-root _site
          test -f _site/index.html
          test -f _site/cases/0001/index.html
          test -f _site/cases/8114/index.html
          test "$(find data -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.gif' -o -iname '*.webp' -o -iname '*.mp4' -o -iname '*.mp3' \) | wc -l)" -eq 0

      - name: حفظ الحالة وربطها بالمشروع المنشور
        shell: bash
        env:
          V4_OPERATION: ${{ steps.request.outputs.operation }}
          V4_FIRST: ${{ steps.request.outputs.first_sequence }}
          V4_LAST: ${{ steps.request.outputs.last_sequence }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "لا توجد بيانات جديدة للحفظ."
            exit 0
          fi
          git commit -m "data: publish V4 ${V4_OPERATION} ${V4_FIRST}-${V4_LAST}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: حفظ نقطة الاستئناف عند فشل لاحق
        if: failure() && steps.request.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          V4_FIRST: ${{ steps.request.outputs.first_sequence }}
          V4_LAST: ${{ steps.request.outputs.last_sequence }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "data: checkpoint V4 failed run ${V4_FIRST}-${V4_LAST}"
          fi
          git fetch origin main
          if test "$(git rev-list --count origin/main..HEAD)" -eq 0; then
            exit 0
          fi
          git rebase origin/main
          git push origin HEAD:main

      - name: متابعة النطاق تلقائيًا من نقطة الاستئناف
        if: steps.collector.outputs.status == 'checkpointed_time_budget' || steps.collector.outputs.status == 'checkpointed_batch_limit'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          V4_OPERATION: ${{ steps.request.outputs.operation }}
          V4_FIRST: ${{ steps.request.outputs.first_sequence }}
          V4_LAST: ${{ steps.request.outputs.last_sequence }}
          V4_WORKERS: ${{ steps.request.outputs.workers }}
          V4_PER_HOST: ${{ steps.request.outputs.per_host_workers }}
          V4_DELAY: ${{ steps.request.outputs.delay }}
          V4_SOURCE_BATCH: ${{ steps.request.outputs.source_batch_size }}
          V4_RECOVERY_LIMIT: ${{ steps.request.outputs.recovery_limit }}
        run: |
          set -euo pipefail
          payload="$(jq -cn \
            --arg operation "$V4_OPERATION" \
            --arg first "$V4_FIRST" \
            --arg last "$V4_LAST" \
            --arg workers "$V4_WORKERS" \
            --arg per_host "$V4_PER_HOST" \
            --arg delay "$V4_DELAY" \
            --arg source_batch "$V4_SOURCE_BATCH" \
            --arg recovery_limit "$V4_RECOVERY_LIMIT" \
            '{ref:"main",inputs:{operation:$operation,first_sequence:$first,last_sequence:$last,workers:$workers,per_host_workers:$per_host,delay:$delay,source_batch_size:$source_batch,recovery_limit:$recovery_limit}}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GH_REPOSITORY/actions/workflows/collect-airwars.yml/dispatches" \
            --data "$payload"

      - name: رفع تقارير التشغيل
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v4-${{ steps.request.outputs.operation || 'invalid' }}-${{ steps.request.outputs.first_sequence || 'request' }}-${{ steps.request.outputs.last_sequence || 'request' }}
          path: |
            data/reports/v4-action-*.json
            data/reports/v4-action-*.md
            data/reports/speed-pilot-*.json
            data/recovery/v4-*.json
            data/pilot/speed-pilot-*-progress.json
          if-no-files-found: ignore
          retention-days: 14
