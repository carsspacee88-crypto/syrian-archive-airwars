<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071c18">
  <meta name="color-scheme" content="light">
  <title>{% block title %}لوحة إدارة الأرشيف السوري{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('admin-static', path='/admin.css') }}?v={{ engine_version }}">
  <script src="{{ url_for('admin-static', path='/admin.js') }}?v={{ engine_version }}" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/admin">
      <span class="brand-mark" aria-hidden="true">س</span>
      <span><b>الأرشيف السوري</b><small>مركز الجمع V{{ engine_version.split('.')[0] }}</small></span>
    </a>
    {% if request.session.get('admin') %}
    <div class="topbar-actions">
      <a class="link-button" href="/admin/archive/projects">مشاريع الأرشفة</a>
      <a class="link-button" href="/">الموقع العام</a>
      <span class="system-chip"><i></i> النظام متصل</span>
      <form method="post" action="/admin/logout">
        <input type="hidden" name="csrf" value="{{ csrf_token }}">
        <button class="link-button" type="submit">خروج</button>
      </form>
    </div>
    {% endif %}
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  {% block scripts %}{% endblock %}
</body>
</html>
