{% extends "base.html" %}
{% block title %}مهمة جمع جديدة{% endblock %}
{% block content %}
<div class="page-heading">
  <div><p class="eyebrow">نطاق جديد</p><h1>إنشاء مهمة جمع</h1></div>
  <a class="button secondary" href="/admin">رجوع</a>
</div>
<section class="card form-card">
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/jobs" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <div class="grid-two">
      <label>أول حادثة<input name="first_sequence" type="number" min="1" max="8114" value="{{ first_sequence or 151 }}" required></label>
      <label>آخر حادثة<input name="last_sequence" type="number" min="1" max="8114" value="{{ last_sequence or 300 }}" required></label>
    </div>
    <fieldset>
      <legend>مراحل المهمة</legend>
      <label class="check"><input type="checkbox" name="collect_incidents" checked> جمع وتطبيع سجلات الحوادث</label>
      <label class="check"><input type="checkbox" name="collect_sources" checked> جلب محتويات المصادر والنسخ المؤرشفة</label>
      <label class="check"><input type="checkbox" name="write_report" checked> إنشاء التقرير النهائي</label>
    </fieldset>
    <div class="notice">لا ترجمة، ولا تنزيل لملفات الوسائط الثنائية. كل فشل يُسجّل منفردًا ولا يوقف بقية النطاق.</div>
    <button class="primary" type="submit">إنشاء المهمة وبدء الطابور</button>
  </form>
</section>
{% endblock %}
