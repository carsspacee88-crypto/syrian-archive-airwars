{% extends "base.html" %}
{% block title %}مشروع أرشفة جديد{% endblock %}
{% block content %}
<section class="hero-row compact"><div><p class="eyebrow">إدخال عام</p><h1>مشروع أرشفة نصية جديد</h1><p class="muted">حدّد الموقع والموصل والنطاق وحدود الجمع وسياسة التهدئة.</p></div><a class="button ghost" href="/admin/archive/projects">رجوع</a></section>
{% if error %}<div class="alert error">{{ error }}</div>{% endif %}
<form class="job-form" method="post" action="/admin/archive/projects"><input type="hidden" name="csrf" value="{{ csrf_token }}">
<section class="card form-section"><div class="advanced-grid">
<label><span>اسم المشروع</span><input name="name" required></label>
<label><span>رابط الموقع الهدف</span><input class="ltr" name="target_url" type="url" required></label>
<label><span>الموصل</span><select name="connector"><option value="airwars">Airwars</option><option value="synthetic_library">Synthetic library</option></select></label>
<label><span>النطاقات المسموحة</span><input class="ltr" name="allowed_domains" placeholder="example.org, archive.example.org"></label>
<label><span>اسم الإصدار</span><input class="ltr" name="release_name" value="textual-release" required></label>
<label class="option-row"><input type="checkbox" name="text_only" checked><span><b>نص فقط</b><small>لا تنزيل وسائط ثنائية</small></span></label>
</div></section>
<section class="card form-section"><label><span>النطاق JSON</span><textarea class="ltr preserved-text" name="scope_json" rows="8">{}</textarea></label><label><span>حدود الجمع JSON</span><textarea class="ltr preserved-text" name="collection_limits_json" rows="5">{"timeout_seconds":15,"retries":2}</textarea></label><label><span>سياسة المعدل JSON</span><textarea class="ltr preserved-text" name="rate_policy_json" rows="5">{"per_host_delay_seconds":0.2}</textarea></label></section>
<button class="button primary submit-job" type="submit">حفظ المشروع</button></form>
{% endblock %}
